name: ProfitBot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo 'Tracked environment file found' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: node --check scripts/autoScanner.js
      - run: node --check scripts/scanAndExecute.js
      - run: npx hardhat compile
